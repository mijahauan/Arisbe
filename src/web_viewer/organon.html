<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arisbe Organon — the Tomos</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/design-system.css" />
  <style>
    /* Organon-specific overrides: read-only archive layout */
    #organon-app {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: 100vh;
    }
    #organon-sidebar {
      display: flex;
      flex-direction: column;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--bottombar-border);
      overflow: hidden;
    }
    #organon-sidebar-header {
      padding: var(--header-pad);
      border-bottom: 1px solid var(--bottombar-border);
    }
    #organon-sidebar-header h1 {
      font-size: 16px;
      font-weight: 700;
      color: var(--sidebar-accent);
      letter-spacing: 0.5px;
    }
    #organon-sidebar-header p {
      font-size: 11px;
      color: var(--ctp-overlay0);
      margin-top: 2px;
    }
    #organon-sidebar-header .mode-tag {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 6px;
      background: var(--sidebar-accent);
      color: var(--sidebar-bg);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      border-radius: 3px;
      text-transform: uppercase;
    }
    #organon-uod-list {
      flex: 1;
      overflow-y: auto;
    }
    .uod-item {
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 1px solid var(--bottombar-border);
      font-size: 12px;
    }
    .uod-item:hover {
      background: var(--sidebar-hover);
    }
    .uod-item.selected {
      background: var(--sidebar-selected);
      border-left: 3px solid var(--sidebar-accent);
      padding-left: 11px;
    }
    .uod-item .uod-name {
      color: var(--sidebar-text);
      font-weight: 500;
    }
    .uod-item .uod-meta {
      color: var(--ctp-overlay0);
      font-size: 10px;
      margin-top: 3px;
    }
    .uod-item .uod-category {
      display: inline-block;
      padding: 1px 5px;
      background: var(--btn-bg);
      color: var(--ctp-subtext0);
      font-size: 9px;
      border-radius: 2px;
      margin-right: 4px;
    }

    /* --- corpus browser controls --- */
    #organon-controls {
      padding: 10px 14px;
      border-bottom: 1px solid var(--bottombar-border);
      display: flex; flex-direction: column; gap: 7px;
    }
    #organon-controls input, #organon-controls select {
      width: 100%; padding: 6px 8px;
      background: var(--btn-bg); color: var(--sidebar-text);
      border: 1px solid var(--bottombar-border); border-radius: 3px; font-size: 12px;
    }
    #organon-controls .ctl-row { display: flex; gap: 7px; align-items: center; }
    #organon-controls .ctl-row label { font-size: 10px; color: var(--ctp-overlay0); white-space: nowrap; }
    #organon-count { font-size: 10px; color: var(--ctp-overlay0); }
    /* kind facet chips */
    #organon-facets { display: flex; flex-wrap: wrap; gap: 4px; }
    .facet-chip {
      font-size: 10px; padding: 2px 7px; border-radius: 10px; cursor: pointer;
      border: 1px solid var(--bottombar-border); color: var(--ctp-subtext0); background: transparent;
      user-select: none;
    }
    .facet-chip:hover { color: var(--sidebar-text); }
    .facet-chip.active { background: var(--sidebar-accent); color: var(--sidebar-bg); border-color: var(--sidebar-accent); font-weight: 600; }
    /* kind group headers */
    .kind-group-header {
      position: sticky; top: 0; z-index: 1;
      display: flex; align-items: center; gap: 6px;
      padding: 6px 14px; cursor: pointer;
      background: var(--ctp-mantle); border-bottom: 1px solid var(--bottombar-border);
      font-size: 11px; font-weight: 700; color: var(--sidebar-text); letter-spacing: .02em;
    }
    .kind-group-header .kg-caret { font-size: 9px; color: var(--ctp-overlay0); width: 9px; }
    .kind-group-header .kg-count { font-size: 10px; color: var(--ctp-overlay0); font-weight: 500; }
    .kind-group.collapsed .uod-item { display: none; }
    /* per-row kind badge + cited dot */
    .uod-kind-badge {
      display: inline-block; padding: 1px 6px; border-radius: 3px;
      font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em;
      margin-right: 5px;
    }
    .uod-cited-dot { font-size: 9px; color: var(--ltt-slate); }
    .uod-cited-dot.cited { color: var(--ctp-green); }
    /* standing badge — what a graph's corpus place rests on (posited/derived/withstood).
       The badge markup + base CSS live in the shared js/standing-badge.js module
       (also used by Agon); the tooltip carries the "correspondence, not truth"
       non-claim.  Only the detail-header size override is Organon-specific. */
    /* detail-header variant: a touch larger, filled */
    #organon-detail-header .standing-badge { font-size: 10px; padding: 2px 9px; vertical-align: middle; }

    #organon-main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #organon-detail-header {
      padding: 14px 18px;
      background: var(--ltt-base);
      border-bottom: 1px solid var(--ltt-border);
      color: var(--ltt-text);
    }
    #organon-detail-header h2 {
      font-size: 18px;
      font-weight: 600;
      color: var(--ltt-text);
      margin: 0;
    }
    #organon-detail-header .detail-meta {
      font-size: 11px;
      color: var(--ctp-overlay0);
      margin-top: 4px;
    }
    #organon-detail-header .detail-meta span {
      margin-right: 12px;
    }
    #organon-detail-extra { margin-top: 8px; }
    #organon-detail-extra .prov-block,
    #organon-detail-extra .ann-block {
      font-size: 11px; color: var(--ltt-subtext-1); margin-top: 6px;
      border-left: 2px solid var(--ltt-border-1); padding: 2px 0 2px 8px;
    }
    #organon-detail-extra .prov-block strong,
    #organon-detail-extra .ann-block strong { color: var(--ltt-text); }
    #organon-detail-extra .prov-kind {
      display: inline-block; font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .04em;
      color: var(--ltt-mauve); background: var(--ltt-mauve-bg);
      border-radius: 3px; padding: 1px 6px; margin-right: 6px;
    }
    #organon-detail-extra .prov-warrant {
      font-size: 10px; color: var(--ctp-overlay0);
    }
    #organon-detail-extra .ann-item { margin: 3px 0; line-height: 1.4; }
    #organon-detail-extra .ann-scope {
      display: inline-block; font-size: 9px; font-weight: 600;
      text-transform: uppercase; color: var(--ctp-overlay0); background: var(--ltt-surface);
      border-radius: 3px; padding: 0 5px; margin-right: 5px; vertical-align: 1px;
    }
    #organon-detail-extra .ann-tag {
      font-size: 9px; color: var(--ltt-overlay); margin-left: 4px;
    }
    /* Liveness facet (manifest floor #7) — forward-facing usage, never a verdict. */
    #organon-detail-extra .live-block {
      margin-top: 6px; padding: 6px 8px; background: var(--ltt-mantle);
      border-radius: 4px; font-size: 11px; color: var(--ltt-subtext);
    }
    #organon-detail-extra .live-block strong { color: var(--ltt-text); margin-right: 4px; }
    .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      margin: 0 5px 0 2px; vertical-align: 0; }
    .live-alive { background: var(--ltt-green); }          /* alive — recently consulted */
    .live-dormant { background: var(--ltt-yellow); }         /* dormant — sliding to desuetude */
    .live-unconsulted { background: var(--ltt-overlay-gray); }     /* never consulted */
    .live-retired { background: var(--ltt-overlay-1); box-shadow: inset 0 0 0 1.5px var(--ltt-red); } /* deliberate second death */
    .live-status { font-weight: 600; }
    .live-tail { opacity: .8; }
    .live-toggle {
      margin-left: 8px; font-size: 10px; padding: 1px 7px; cursor: pointer;
      border: 1px solid var(--kind-none-bg); border-radius: 3px; background: #fff; color: var(--ltt-subtext);
    }
    .live-toggle:hover { background: var(--ltt-surface); }
    /* List status dot (same palette) before the name. */
    .uod-item .live-dot { margin-right: 6px; }
    #organon-canvas {
      flex: 1;
      background: var(--canvas-bg);
      overflow: hidden;
      position: relative;
    }
    #organon-canvas-placeholder {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--ctp-overlay0);
      font-size: 14px;
      text-align: center;
    }
    #organon-canvas svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* --- unified action toolbar (transfer in/out + cross-mode) --- */
    #organon-actionbar {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px; background: var(--ctp-mantle);
      border-bottom: 1px solid var(--bottombar-border);
    }
    .xfer-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px; font-size: 12px; cursor: pointer; white-space: nowrap;
      background: var(--btn-bg); color: var(--sidebar-text);
      border: 1px solid var(--bottombar-border); border-radius: 4px;
    }
    .xfer-btn:hover:not(:disabled) { background: var(--sidebar-hover); }
    .xfer-btn:disabled { opacity: .38; cursor: not-allowed; }
    .xfer-btn .xfer-ico { font-size: 13px; line-height: 1; }
    .xfer-sep { width: 1px; align-self: stretch; background: var(--bottombar-border); margin: 0 3px; }
    .xfer-spacer { flex: 1; }
    #organon-status {
      padding: var(--statusbar-pad);
      background: var(--bottombar-bg);
      color: var(--sidebar-text);
      font-size: 11px;
      border-top: 1px solid var(--bottombar-border);
    }
    #organon-status.error {
      color: var(--error);
    }
    .empty-state {
      padding: 20px 14px;
      color: var(--ctp-overlay0);
      font-size: 12px;
      text-align: center;
    }
    /* Overview (adaptive-scope) placeholder badges — drawn into the SVG over a
       collapsed cut. The pill is a navigation affordance, not a logical mark:
       it reports *form* (counts/polarity/boundary degree), never actuality. */
    .overview-badge { cursor: pointer; }
    .overview-badge .ov-hit { fill: rgba(137,180,250,0.05); }
    .overview-badge:hover .ov-hit { fill: rgba(137,180,250,0.16); }
    .overview-badge .ov-pill { fill: var(--ctp-base); opacity: 0.92; }
    .overview-badge .ov-pill-text { fill: var(--ctp-text); font: 600 12px ui-sans-serif, system-ui, sans-serif; }
    .overview-badge .ov-sub-text { fill: var(--ctp-subtext0); font: 500 10px ui-sans-serif, system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="organon-app">

    <aside id="organon-sidebar">
      <div data-mode-nav></div>
      <div id="organon-sidebar-header">
        <p>Tomos · the corpus</p>
        <span class="mode-tag">Read-only</span>
      </div>

      <div id="organon-controls">
        <input
          type="text"
          id="organon-filter-input"
          placeholder="Search name, description, source, tags…"
          autocomplete="off"
        />
        <div class="ctl-row">
          <label for="organon-sort">Sort</label>
          <select id="organon-sort">
            <option value="kind">Group by kind</option>
            <option value="name">Name (A–Z)</option>
            <option value="modified">Recently modified</option>
          </select>
        </div>
        <div id="organon-facets"></div>
        <div id="organon-count"></div>
      </div>

      <div id="organon-uod-list">
        <div class="empty-state">Loading corpus…</div>
      </div>
    </aside>

    <main id="organon-main">
      <!-- Unified action toolbar: graphs in/out of the corpus (Import / Export)
           and cross-mode hand-offs, one consistent place with one icon family.
           Item actions enable once a UoD is open. -->
      <div id="organon-actionbar">
        <button class="xfer-btn" id="btn-import"
                title="Admit a graph from a book or page into the corpus (low warrant)">
          <span class="xfer-ico">↓</span> Import</button>
        <span class="xfer-sep"></span>
        <button class="xfer-btn" id="act-ergasterion" disabled
                title="Open a copy in the workshop to transform (a regime-1 draft; the corpus item is not changed)">
          <span class="xfer-ico">✎</span> Open in Ergasterion</button>
        <button class="xfer-btn" id="act-agon" disabled
                title="Carry this graph into the arena as the proposal G — the claim to be tested against a model M">
          <span class="xfer-ico">⚔</span> Propose in Agon</button>
        <button class="xfer-btn" id="act-agon-model" disabled
                title="Carry this graph into the arena as the reference model M — the world a proposal G is tested against">
          <span class="xfer-ico">⚖</span> as model M</button>
        <button class="xfer-btn" id="act-copy" disabled
                title="Copy the EGIF linear form to the clipboard">
          <span class="xfer-ico">⧉</span> Copy</button>
        <span class="xfer-spacer"></span>
        <button class="xfer-btn" id="act-export" disabled
                title="Export this graph in the current view style + layout">
          <span class="xfer-ico">↑</span> Export</button>
      </div>

      <header id="organon-detail-header">
        <h2 id="organon-detail-title">Select a UoD from the archive</h2>
        <div class="detail-meta" id="organon-detail-meta"></div>
        <div id="organon-detail-extra"></div>
        <div id="organon-export" style="display:none; margin-top:8px; font-size:12px;">
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px;">
            <label style="font-size:10px; color:var(--ctp-overlay0);">Format</label>
            <select id="export-format"></select>
            <label id="export-cite-wrap" style="display:none; font-size:10px; color:var(--ctp-overlay0);"
                   title="Emit this graph's scholarly citation (from its provenance) as a caption under the figure.">
              <input type="checkbox" id="export-cite" /> cite</label>
            <button id="export-go" style="padding:4px 10px; cursor:pointer;">Export</button>
            <button id="export-chain-go" style="display:none; padding:4px 10px; cursor:pointer;"
                    title="Export the whole worked derivation as one authentic-Peirce LaTeX document — one captioned figure per proof step.">Export worked chain (LaTeX)</button>
            <span id="export-status" style="font-size:10px; color:var(--ctp-overlay0);"></span>
          </div>
          <div id="export-view-note" style="font-size:10px; color:var(--ctp-overlay0); margin-top:4px;">
            Exports the current view — set the style and layout in the toolbar above the canvas.
          </div>
          <div id="export-output" style="display:none; margin-top:8px;">
            <textarea id="export-text" readonly style="width:100%; min-height:70px; font-family:ui-monospace,Menlo,monospace; font-size:11px;"></textarea>
            <div style="margin-top:4px; display:flex; gap:8px;">
              <button id="export-copy" style="padding:3px 8px; cursor:pointer;">Copy</button>
              <a id="export-download" download style="font-size:11px;"></a>
            </div>
          </div>
          <!-- Citation (from provenance) — fabricates nothing: a sourceless graph
               reports honestly and the cite caption falls back to "reproduced with Arisbe". -->
          <div id="export-cite-block" style="display:none; margin-top:10px; border-top:1px solid var(--ctp-surface1,#45475a); padding-top:8px;">
            <div style="font-size:10px; color:var(--ctp-overlay0); margin-bottom:3px;">Citation <span id="cite-source-note"></span></div>
            <div id="cite-line" style="font-size:11px; margin-bottom:4px;"></div>
            <textarea id="cite-bibtex" readonly style="width:100%; min-height:58px; font-family:ui-monospace,Menlo,monospace; font-size:11px;"></textarea>
            <div style="margin-top:4px;"><button id="cite-copy" style="padding:3px 8px; cursor:pointer;">Copy BibTeX</button></div>
          </div>
        </div>
      </header>

      <!-- View-style toolbar: style is a *projection* of one meaning, so any
           form can be viewed in any style directly (Dau / Peirce / Sowa) — a
           basic viewing option, distinct from the Export path. Shown whenever a
           form is on the canvas. §3.3 attests every styled render. -->
      <div id="view-toolbar" style="display:none; align-items:center; gap:8px;
           padding:6px 12px; background:var(--ctp-base); border-bottom:1px solid var(--ctp-surface0);">
        <label for="view-lens" style="font-size:11px; color:var(--ctp-subtext0);">Lens</label>
        <select id="view-lens" style="font-size:12px;" title="A read-only projection of this UoD — never the asserted drawing.">
          <option value="drawing">Drawing (default)</option>
          <option value="overview">Drawing — overview (adaptive scope)</option>
          <option value="well">Well — 2.5-D negation depth</option>
          <option value="storyboard" hidden disabled>Storyboard — the line of thought</option>
          <option value="time-stack" hidden disabled>Time-stack — the derivation as a 2.5-D film</option>
          <option value="derivation-dag" hidden disabled>Derivation DAG — branch structure</option>
          <option value="modal" hidden disabled>Modal reading — ◇ / □ off the history</option>
          <option value="audit" hidden disabled>Audit — verdict trajectory (M through dialog)</option>
          <option value="accessible">Structure — coordinate-free (keyboard / screen-reader)</option>
        </select>
        <!-- Overview (adaptive-scope) controls: shown only in the overview lens.
             Collapse deep cuts into content-sized placeholders so a graph too
             large to draw whole can still be navigated (docs/ADAPTIVE_SCOPE_VIEWER.md).
             Tap a placeholder to expand it; the camera holds so detail appears
             in place. The view is attested by the weaker attest_overview (visible
             part corresponds + placeholders faithfully summarize) — never a
             promotion source. -->
        <span id="overview-controls" style="display:none; align-items:center; gap:8px; margin-left:8px;">
          <button id="ov-reset" style="font-size:11px; padding:3px 9px; cursor:pointer;"
                  title="Collapse everything back to the top-level overview">⊖ Collapse all</button>
          <span id="ov-hint" style="font-size:10px; color:var(--ctp-overlay0);"></span>
        </span>
        <label for="view-style" style="font-size:11px; color:var(--ctp-subtext0); margin-left:8px;">View style</label>
        <select id="view-style" style="font-size:12px;">
          <option value="">Dau (default)</option>
          <option value="dau-compliant@1.0">Dau — mathematical</option>
          <option value="peirce-authentic@1.0">Peirce — handwritten</option>
          <option value="sowa-compliant@1.0">Sowa — conceptual graph</option>
        </select>
        <label for="view-engine" style="font-size:11px; color:var(--ctp-subtext0); margin-left:8px;">Layout</label>
        <select id="view-engine" style="font-size:12px;">
          <option value="elk">ELK (default)</option>
          <option value="tension">Tension — relation between arguments</option>
        </select>
        <!-- Style-only reprojection note: a non-default style or layout redraws the
             SAME proposition, so it inherits this graph's standing unchanged (the mode
             contract's second, standing-preserving route into the corpus). Shown only
             when a non-default projection is active; §3.3 attests correspondence, not
             truth. -->
        <span id="reprojection-note" title="A style or layout change is a style-only reprojection: it redraws the same mathematical object, so the proposition — and its standing — are unchanged. §3.3 attests the picture↔proposition correspondence, never truth."
              style="display:none; align-items:center; gap:4px; margin-left:auto; font-size:10px;
                     color:var(--ctp-mauve); cursor:help; white-space:nowrap;">
          ↺ style-only reprojection · standing unchanged
        </span>
      </div>

      <!-- Diachronic chain player: a UoD with a persisted TransformationChain
           (a worked proof) can be played through step by step — base state,
           then each rule application — so the reasoning episode is watched
           unfolding, not just its final picture. Hidden for synchronic UoDs. -->
      <div id="chain-player" style="display:none; align-items:center; gap:10px;
           padding:8px 12px; background:var(--ctp-mantle); border-bottom:1px solid var(--ctp-surface0);
           flex-wrap:wrap;">
        <div style="display:flex; gap:4px;">
          <button id="cp-first" title="Base state" style="cursor:pointer; padding:3px 8px;">«</button>
          <button id="cp-prev"  title="Previous move" style="cursor:pointer; padding:3px 8px;">‹</button>
          <button id="cp-play"  title="Play" style="cursor:pointer; padding:3px 10px;">▶ Play</button>
          <button id="cp-next"  title="Next move" style="cursor:pointer; padding:3px 8px;">›</button>
          <button id="cp-last"  title="Final state" style="cursor:pointer; padding:3px 8px;">»</button>
        </div>
        <span id="cp-counter" style="font-size:12px; color:var(--ctp-subtext0); min-width:90px;"></span>
        <span id="cp-annotation" style="font-size:12px; color:var(--ctp-text); flex:1 1 240px;"></span>
      </div>

      <div id="organon-canvas">
        <div id="organon-canvas-placeholder">
          The Organon is read-only.<br />
          Pick any UoD on the left to view its drawing.
        </div>
      </div>

      <div id="organon-status">Ready</div>
    </main>
  </div>

  <!-- Adaptive-scope lenses (read-only navigation projections). d3 lays out the
       circle-packing footprint; the importmap resolves three.js for the
       lazily-imported Well lens (loaded only when first selected). -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }}
  </script>
  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
  <script src="js/mode-nav.js"></script>
  <script src="js/primer.js"></script>
  <script src="js/standing-badge.js"></script>
  <script src="js/linear-form-panel.js"></script>
  <script src="js/diagram-transition.js"></script>
  <script src="js/diagram-viewer.js"></script>
  <script src="js/context-reflex.js"></script>
  <script src="js/lens-common.js"></script>
  <script src="js/storyboard-lens.js"></script>
  <script src="js/derivation-dag-lens.js"></script>
  <script src="js/modal-lens.js"></script>
  <script src="js/audit-lens.js"></script>
  <script src="js/accessible-lens.js"></script>
  <script>
    (function () {
      const listEl = document.getElementById('organon-uod-list');
      const filterEl = document.getElementById('organon-filter-input');
      const titleEl = document.getElementById('organon-detail-title');
      const metaEl = document.getElementById('organon-detail-meta');
      const canvasEl = document.getElementById('organon-canvas');
      const statusEl = document.getElementById('organon-status');

      let allUods = [];
      let sortMode = 'kind';     // 'kind' (grouped) | 'name' | 'modified'
      let activeKind = null;     // facet filter: a kind id, or null for all
      let selectedUodId = null;
      let svgPanZoomInstance = null;
      let exportUodId = null;
      let exportFormats = [];
      let currentEgif = '';   // EGIF of the open UoD (for Copy / Use-in-Agon)

      // Diachronic chain player state.
      let chainFrames = [];      // ordered frames from /chain (base + steps)
      let chainIndex = 0;        // currently shown frame
      let chainPlayTimer = null; // setInterval handle while playing
      let currentCitation = null; // {citation, bibtex, key, has_source} from /export/citation

      // View-projection state (style + layout engine; both are projection
      // choices that persist across UoD switches — §3.3 attests every render).
      let currentStyle = '';
      let currentEngine = 'elk';

      // Adaptive-scope lens state. The lens is a read-only navigation projection
      // of the loaded UoD; "drawing" is the §3.3-attested SVG (the others are not
      // the drawing and never a promotion source — docs/MANIFEST_AND_MEANING.md).
      let currentLens = 'drawing';
      let currentHasChain = false;
      let currentDrawingSvg = '';      // last static drawing (for switch-back, non-chain)
      let currentDrawingForms = null;
      let currentStructure = null;     // cached /structure for the Well lens
      let currentHistory = null;       // cached /history-structure for diachronic lenses
      let activeLensHandle = null;     // {destroy()} of the mounted non-drawing lens
      // Context reflex (shared ContextReflex panel): the ground + the introspection
      // of the graph currently on the canvas. Introspection travels with the
      // rendered state (detail payload / chain frame), so ids match the svg.
      let currentContextGround = null;
      let currentContextIntrospection = null;
      // Overview (adaptive-scope) state: the cuts the reader has drilled into
      // (ancestors auto-included server-side). Empty ⇒ the auto-expand policy
      // shows the top of the graph; each expand re-fetches a larger visible part.
      let overviewExpanded = new Set();
      let overviewLoading = false;     // guards the camera mode (fit first, then hold)
      function styleQuery() {
        const q = [];
        if (currentStyle) q.push('style=' + encodeURIComponent(currentStyle));
        if (currentEngine && currentEngine !== 'elk') {
          q.push('engine=' + encodeURIComponent(currentEngine));
        }
        return q.length ? '?' + q.join('&') : '';
      }

      function setStatus(msg, isError) {
        statusEl.textContent = msg;
        statusEl.classList.toggle('error', !!isError);
      }

      // The import-kind taxonomy is the corpus's shelving dimension
      // (docs/CORPUS_AND_IMPORT_MODEL.md §2). Order, label and colour per kind.
      const KIND_META = {
        ontology:     { label: 'Ontologies',    color: 'var(--ltt-mauve)', bg: 'var(--ltt-mauve-bg)' },
        proof:        { label: 'Proofs',        color: 'var(--kind-proof-fg)', bg: 'var(--kind-proof-bg)' },
        pattern:      { label: 'Patterns',      color: 'var(--kind-pattern-fg)', bg: 'var(--kind-pattern-bg)' },
        domain_model: { label: 'Domain models', color: 'var(--kind-domain-fg)', bg: 'var(--kind-domain-bg)' },
        exemplar:     { label: 'Exemplars',     color: 'var(--kind-exemplar-fg)', bg: 'var(--kind-exemplar-bg)' },
        _none:        { label: 'Unclassified',  color: 'var(--kind-none-fg)', bg: 'var(--kind-none-bg)' },
      };
      const KIND_ORDER = ['ontology', 'proof', 'pattern', 'domain_model', 'exemplar', '_none'];
      const collapsedKinds = {};   // kind -> true when its group is collapsed

      function kindOf(u) { return u.kind && KIND_META[u.kind] ? u.kind : '_none'; }

      // The standing badge — what this graph's corpus place rests on. The title
      // (hover) carries the meaning AND the correspondence-not-truth non-claim, so
      // the badge is never read as a verdict. ``compact`` shows just the glyph.
      // Markup + base CSS live in the shared StandingBadge module (js/standing-badge.js),
      // also used by Agon when a contest is disposed.
      function standingBadgeHtml(standing, compact) {
        return window.StandingBadge ? window.StandingBadge.html(standing, compact) : '';
      }

      function makeItemEl(uod) {
        const item = document.createElement('div');
        item.className = 'uod-item';
        if (uod.uod_id === selectedUodId) item.classList.add('selected');
        item.dataset.uodId = uod.uod_id;
        const km = KIND_META[kindOf(uod)];
        const badge = '<span class="uod-kind-badge" style="color:' + km.color +
          ';background:' + km.bg + '">' + escapeHtml((uod.kind || 'unclassified')) + '</span>';
        const states = uod.total_states && uod.total_states > 1
          ? '<span>' + uod.total_states + ' states</span>' : '';
        const cited = '<span class="uod-cited-dot ' + (uod.cited ? 'cited' : '') + '" title="' +
          (uod.cited ? 'cited from a source' : 'authored here') + '">●</span> ' +
          (uod.cited ? 'cited' : 'authored');
        // Forward-facing usage dot (manifest floor #7) — shown only once a telling
        // has a status worth flagging (alive / dormant / retired); the unconsulted
        // majority stays unmarked so the consulted ones stand out.
        const ls = uod.liveness_status;
        const live = (ls && ls !== 'unconsulted')
          ? ' · <span class="live-dot live-' + ls + '" title="' + ls +
            (uod.consult_count ? ' · consulted ' + uod.consult_count + '×' : '') + '"></span>' + ls
          : '';
        const standing = standingBadgeHtml(uod.standing, true);
        item.innerHTML =
          '<div class="uod-name">' + badge + escapeHtml(uod.name) + '</div>' +
          '<div class="uod-meta">' + (standing ? standing + ' ' : '') +
          cited + (states ? ' · ' + states : '') + live + '</div>';
        item.addEventListener('click', function () { openUod(uod.uod_id); });
        return item;
      }

      function renderList(uods) {
        listEl.innerHTML = '';
        if (uods.length === 0) {
          listEl.innerHTML = '<div class="empty-state">No matches.</div>';
          return;
        }
        if (sortMode !== 'kind') {
          const sorted = uods.slice().sort(sortMode === 'modified'
            ? function (a, b) { return (b.last_modified || '').localeCompare(a.last_modified || ''); }
            : function (a, b) { return (a.name || '').localeCompare(b.name || ''); });
          sorted.forEach(function (u) { listEl.appendChild(makeItemEl(u)); });
          return;
        }
        // Group by kind, in the taxonomy order, with collapsible headers + counts.
        const groups = {};
        uods.forEach(function (u) { (groups[kindOf(u)] = groups[kindOf(u)] || []).push(u); });
        KIND_ORDER.forEach(function (k) {
          const list = groups[k];
          if (!list || !list.length) return;
          list.sort(function (a, b) { return (a.name || '').localeCompare(b.name || ''); });
          const wrap = document.createElement('div');
          wrap.className = 'kind-group' + (collapsedKinds[k] ? ' collapsed' : '');
          const hdr = document.createElement('div');
          hdr.className = 'kind-group-header';
          hdr.innerHTML = '<span class="kg-caret">' + (collapsedKinds[k] ? '▸' : '▾') + '</span>' +
            '<span>' + KIND_META[k].label + '</span>' +
            '<span class="kg-count">' + list.length + '</span>';
          hdr.addEventListener('click', function () {
            collapsedKinds[k] = !collapsedKinds[k];
            applyFilter();
          });
          wrap.appendChild(hdr);
          list.forEach(function (u) { wrap.appendChild(makeItemEl(u)); });
          listEl.appendChild(wrap);
        });
      }

      function escapeHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Search matches across name, id, description, source and tags — not just
      // the name (the old filter's blind spot at corpus scale).
      function matchesQuery(u, q) {
        if (!q) return true;
        const hay = [u.name, u.uod_id, u.description, (u.tags || []).join(' '),
          (u.category || '').replace(/_/g, ' ')].join(' ').toLowerCase();
        return hay.indexOf(q) >= 0;
      }

      function applyFilter() {
        const q = filterEl.value.trim().toLowerCase();
        const filtered = allUods.filter(function (u) {
          if (activeKind && kindOf(u) !== activeKind) return false;
          return matchesQuery(u, q);
        });
        renderList(filtered);
        const countEl = document.getElementById('organon-count');
        if (countEl) {
          const kinds = new Set(filtered.map(kindOf));
          countEl.textContent = filtered.length + ' of ' + allUods.length +
            ' items · ' + kinds.size + ' kind' + (kinds.size === 1 ? '' : 's') +
            (q || activeKind ? ' (filtered)' : '');
        }
      }

      // Facet chips: one per kind present, plus "All". Click to scope the list.
      function renderFacets() {
        const host = document.getElementById('organon-facets');
        if (!host) return;
        const counts = {};
        allUods.forEach(function (u) { counts[kindOf(u)] = (counts[kindOf(u)] || 0) + 1; });
        const chips = ['<span class="facet-chip' + (activeKind ? '' : ' active') +
          '" data-kind="">All ' + allUods.length + '</span>'];
        KIND_ORDER.forEach(function (k) {
          if (!counts[k]) return;
          chips.push('<span class="facet-chip' + (activeKind === k ? ' active' : '') +
            '" data-kind="' + k + '">' + KIND_META[k].label + ' ' + counts[k] + '</span>');
        });
        host.innerHTML = chips.join('');
        Array.from(host.querySelectorAll('.facet-chip')).forEach(function (chip) {
          chip.addEventListener('click', function () {
            activeKind = chip.dataset.kind || null;
            renderFacets();
            applyFilter();
          });
        });
      }

      async function loadCorpus() {
        setStatus('Loading corpus…');
        try {
          const res = await fetch('/organon/uods');
          const body = await res.json();
          if (!body.success) {
            setStatus('Failed to load corpus: ' + (body.error && body.error.message), true);
            listEl.innerHTML = '<div class="empty-state">Load failed.</div>';
            return;
          }
          allUods = body.data || [];
          renderFacets();
          applyFilter();
          setStatus('Loaded ' + allUods.length + ' UoDs from tomos corpus.');
        } catch (e) {
          setStatus('Network error: ' + e.message, true);
          listEl.innerHTML = '<div class="empty-state">Network error.</div>';
        }
      }

      async function openUod(uodId) {
        selectedUodId = uodId;
        // Re-mark selection without rebuilding list contents
        Array.from(listEl.querySelectorAll('.uod-item')).forEach(function (el) {
          el.classList.toggle('selected', el.dataset.uodId === uodId);
        });
        setStatus('Loading ' + uodId + '…');
        titleEl.textContent = uodId;
        metaEl.textContent = '';
        setItemActionsEnabled(false);  // re-enabled by renderDetail on success
        hidePlayer();  // a new UoD may or may not be diachronic
        canvasEl.innerHTML = '<div id="organon-canvas-placeholder">Loading…</div>';

        try {
          const res = await fetch('/organon/uods/' + encodeURIComponent(uodId) + styleQuery());
          const body = await res.json();
          if (!body.success) {
            const err = body.error || {};
            setStatus(
              'Failed to load ' + uodId + ': ' + (err.message || 'unknown error'),
              true
            );
            canvasEl.innerHTML =
              '<div id="organon-canvas-placeholder" style="color:var(--ctp-maroon);">' +
              escapeHtml(err.message || 'Load failed') +
              '</div>';
            return;
          }
          renderDetail(body.data);
          setStatus(
            'Loaded ' +
              uodId +
              ' (' +
              body.data.egi_summary.vertex_count +
              ' vertices, ' +
              body.data.egi_summary.edge_count +
              ' edges, ' +
              body.data.egi_summary.cut_count +
              ' cuts). §3.3 attested at load + render boundaries.'
          );
          // If this UoD is diachronic (carries a worked chain), reveal the
          // player and start at the base state.
          loadChain(uodId);
        } catch (e) {
          setStatus('Network error loading ' + uodId + ': ' + e.message, true);
        }
      }

      function shapeText(summary) {
        if (!summary) return '';
        return summary.vertex_count + 'V / ' +
          summary.edge_count + 'E / ' + summary.cut_count + 'C';
      }

      // The typed provenance bundle (src/provenance.py): import kind + per-layer
      // warrant + the theorem / proof / method source lines. Falls back to the
      // older single-CSL bibliography when no bundle is present.
      function renderProvenance(data) {
        const p = data.provenance;
        if (p && (p.kind || (p.formatted && (p.formatted.theorem || p.formatted.proof ||
              (p.formatted.methods && p.formatted.methods.length))))) {
          const f = p.formatted || {};
          const rows = [];
          const head = [];
          if (p.kind) head.push('<span class="prov-kind">' + escapeHtml(p.kind) + '</span>');
          if (p.warrant) {
            const w = Object.entries(p.warrant).map(function (kv) { return kv[0] + ':' + kv[1]; }).join(' · ');
            head.push('<span class="prov-warrant">warrant ' + escapeHtml(w) + '</span>');
          }
          if (head.length) rows.push(head.join(' '));
          if (f.theorem) rows.push('<strong>theorem:</strong> ' + escapeHtml(f.theorem));
          if (f.proof) {
            // U19: make the transcribed-vs-authored distinction explicit — a
            // published proof copied in vs. a derivation original to Arisbe are
            // different facts a scholar must not have to infer from the prose.
            const dk = p.proof_source && p.proof_source.kind;
            const chip = 'style="font-size:9px; font-weight:600; padding:1px 6px; border-radius:9px; ' +
              'border:1px solid currentColor; color:var(--ctp-overlay1,#7f849c); margin-left:4px; vertical-align:middle;"';
            const dlabel = dk === 'transcribed'
              ? '<span ' + chip + ' title="This derivation is transcribed from a published proof (its citation).">transcribed</span>'
              : (dk === 'authored'
                ? '<span ' + chip + ' title="This derivation is original to Arisbe (authored here), not transcribed from a source.">authored here</span>'
                : '');
            rows.push('<strong>proof:</strong> ' + escapeHtml(f.proof) + (dlabel ? ' ' + dlabel : ''));
          }
          if (f.methods && f.methods.length) {
            rows.push('<strong>method:</strong> ' + escapeHtml(f.methods.join('; ')));
          }
          // U17: the construct-level skip-report for an imported ontology — the
          // OWL/RDF axioms that could not be translated, reported not dropped
          // (the manifest floor), visible in the app, not only at the CLI.
          const skipped = p.skipped_constructs || [];
          if (skipped.length) {
            rows.push('<strong>partial translation:</strong> <span style="color:var(--ctp-peach,#fab387);">'
              + skipped.length + ' construct(s) not translated</span> '
              + '<span style="color:var(--ctp-overlay0);">(reported, never silently dropped)</span>'
              + '<div style="margin-top:2px; font-size:11px; color:var(--ctp-overlay1);">'
              + skipped.map(function (s) { return '⚠ ' + escapeHtml(s); }).join('<br>') + '</div>');
          }
          return '<div class="prov-block">' + rows.join('<br>') + '</div>';
        }
        if (data.bibliography && data.bibliography.formatted) {
          return '<div class="prov-block"><strong>provenance:</strong> ' +
            escapeHtml(data.bibliography.formatted) + '</div>';
        }
        return '';
      }

      // The annotation layer (src/annotations.py): marginalia about the UoD /
      // chain / step. Step-scoped notes also ride the chain player per frame; the
      // uod- and chain-scoped ones are the standing commentary shown here.
      function renderAnnotations(data) {
        const anns = (data.annotations || []).filter(function (a) { return a && a.text; });
        if (!anns.length) return '';
        const order = { uod: 0, chain: 1, step: 2, element: 3 };
        anns.sort(function (a, b) { return (order[a.scope] || 9) - (order[b.scope] || 9); });
        const items = anns.map(function (a) {
          const tags = (a.tags || []).map(function (t) {
            return '<span class="ann-tag">#' + escapeHtml(t) + '</span>';
          }).join('');
          const scope = a.scope === 'step' && a.step_id
            ? escapeHtml(a.step_id) : escapeHtml(a.scope || 'note');
          return '<div class="ann-item"><span class="ann-scope">' + scope + '</span>' +
            escapeHtml(a.text) + tags + '</div>';
        }).join('');
        return '<div class="ann-block"><strong>notes</strong>' + items + '</div>';
      }

      // Forward-facing provenance (manifest floor #7: "two deaths, so track
      // liveness"): is this telling still alive in the conversation, or sliding into
      // desuetude? *Form* of use, never a verdict — outside §3.3. Carries a Retire /
      // Revive toggle (the deliberate second death, fully reversible).
      function sinceText(days) {
        if (days == null) return 'never';
        if (days === 0) return 'today';
        if (days === 1) return 'yesterday';
        return days + ' days ago';
      }
      function renderLiveness(data) {
        const L = data.liveness;
        if (!L) return '';
        const status = L.status || 'unconsulted';
        const label = { alive: 'alive', dormant: 'dormant', unconsulted: 'never consulted',
                        retired: 'retired' }[status] || status;
        const bits = [];
        if (L.count) bits.push('consulted ' + L.count + '×');
        if (L.last) bits.push('last ' + sinceText(L.days_since_last));
        const tail = bits.length ? ' · ' + bits.join(' · ') : '';
        const btn = '<button id="live-toggle" class="live-toggle" data-retired="' +
          (L.retired ? '1' : '0') + '">' + (L.retired ? 'Revive' : 'Retire') + '</button>';
        return '<div class="live-block"><strong>liveness</strong> ' +
          '<span class="live-dot live-' + escapeHtml(status) + '"></span>' +
          '<span class="live-status">' + escapeHtml(label) + '</span>' +
          '<span class="live-tail">' + escapeHtml(tail) + '</span>' + btn + '</div>';
      }
      // Wire the Retire/Revive toggle inside the detail-extra block (event-delegated
      // each render). Toggling is reversible and touches only the usage stance.
      function wireLivenessToggle(uodId) {
        const btn = document.getElementById('live-toggle');
        if (!btn) return;
        btn.addEventListener('click', function () {
          const makeRetired = btn.dataset.retired !== '1';
          btn.disabled = true;
          fetch('/organon/uods/' + encodeURIComponent(uodId) + '/liveness/retire',
                { method: 'POST', headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ retired: makeRetired }) })
            .then(function (r) { return r.json(); })
            .then(function (b) {
              if (b && b.success) {
                const extraEl = document.getElementById('organon-detail-extra');
                // re-render just the facet with the fresh summary
                const fresh = { liveness: b.data, provenance: null, annotations: [] };
                const block = extraEl.querySelector('.live-block');
                if (block) { block.outerHTML = renderLiveness(fresh); wireLivenessToggle(uodId); }
              } else { btn.disabled = false; }
            })
            .catch(function () { btn.disabled = false; });
        });
      }

      function renderDetail(data) {
        const meta = data.metadata || {};
        titleEl.textContent = meta.name || data.uod_id;
        const parts = [];
        if (data.standing) {
          parts.push('<span>' + standingBadgeHtml(data.standing, false) + '</span>');
        }
        // A persistent, positive §3.3 signal (not only visible when it fails):
        // every served (EGI, drawing) is attested at the load + render boundaries.
        if (data.svg) {
          parts.push('<span title="Picture and proposition denote the same object — ' +
            'the §3.3 correspondence check, attested at the load and render boundaries. ' +
            'Correspondence, not truth." ' +
            'style="color:var(--ctp-green,#a6e3a1); border:1px solid currentColor; ' +
            'border-radius:10px; padding:1px 7px; font-size:9px; font-weight:600; ' +
            'letter-spacing:.02em; cursor:help; vertical-align:middle;">§3.3 ✓ attested</span>');
        }
        if (meta.category) {
          parts.push('<span><strong>category:</strong> ' + escapeHtml(meta.category.replace(/_/g, ' ')) + '</span>');
        }
        if (meta.authors && meta.authors.length) {
          parts.push('<span><strong>authors:</strong> ' + escapeHtml(meta.authors.join(', ')) + '</span>');
        }
        if (meta.source_citation) {
          parts.push('<span><strong>source:</strong> ' + escapeHtml(meta.source_citation) + '</span>');
        }
        if (meta.last_modified) {
          parts.push('<span><strong>modified:</strong> ' + escapeHtml(meta.last_modified.split('T')[0]) + '</span>');
        }
        if (data.egi_summary) {
          // The counts live in their own span so the chain player can update
          // them per frame (the drawing's "shape" changes as the proof steps).
          parts.push(
            '<span><strong>shape:</strong> <span id="shape-counts">' +
              shapeText(data.egi_summary) + '</span></span>'
          );
        }
        metaEl.innerHTML = parts.join(' ');

        // The typed provenance bundle + the annotation layer (the outside-record
        // every corpus item now carries — docs/CORPUS_AND_IMPORT_MODEL.md). These
        // sit *outside* §3.3: they describe the source, they are not signs in the
        // graph.
        const extraEl = document.getElementById('organon-detail-extra');
        if (extraEl) {
          extraEl.innerHTML = renderLiveness(data) + renderProvenance(data) + renderAnnotations(data);
          wireLivenessToggle(data.uod_id);
        }

        // Enable the item actions + reveal the view-style toolbar for the loaded
        // UoD. The export panel stays collapsed until the Export button is hit.
        exportUodId = data.uod_id;
        try {
          currentEgif = (((data.linear_forms || {}).forms || {}).egif || {}).text || '';
        } catch (_) { currentEgif = ''; }
        setItemActionsEnabled(true);
        const exportPanel = document.getElementById('organon-export');
        if (exportPanel) exportPanel.style.display = 'none';
        const exOut = document.getElementById('export-output');
        if (exOut) exOut.style.display = 'none';
        // Chain-export button is revealed by loadChain() only when a worked chain
        // exists; reset it here (a non-chained UoD has none). Load the citation.
        const chainBtn = document.getElementById('export-chain-go');
        if (chainBtn) chainBtn.style.display = 'none';
        loadCitation(data.uod_id);
        const viewBar = document.getElementById('view-toolbar');
        if (viewBar) viewBar.style.display = 'flex';

        // Each new UoD starts in the Drawing lens; clear cached lens data and reset
        // the selector. Diachronic-lens availability is (re)set by loadChain().
        currentDrawingSvg = data.svg || '';
        currentDrawingForms = data.linear_forms;
        currentStructure = null;
        currentHistory = null;
        currentLens = 'drawing';
        destroyActiveLens();
        overviewExpanded = new Set();
        setOverviewControls(false);
        if (viewLensSel) viewLensSel.value = 'drawing';
        setDiachronicLensesAvailable(false);

        // Context reflex: the ground of this UoD (universe + standing + kind).
        // Derivation position is filled in by the chain player (showFrame); a
        // non-chained UoD shows no derivation line — it is a posited/imported
        // graph, not a derived one. Introspection is fetched for the canonical
        // state (a chained UoD then re-introspects per frame in showFrame).
        currentContextGround = {
          universe: meta.name || data.uod_id,
          kind: meta.category ? meta.category.replace(/_/g, ' ') : null,
          standingHtml: data.standing ? standingBadgeHtml(data.standing, true) : null,
        };
        currentContextIntrospection = data.introspection || null;
        if (canvasEl) canvasEl.dataset.cxSel = '';
        renderCanvas(data.svg || '', data.linear_forms, false);
      }

      // Re-render the current view (static detail or the current chain frame)
      // in the chosen style — no Export round-trip. §3.3 attests each render.
      async function applyViewStyle() {
        if (!selectedUodId) return;
        // In the overview lens, a style change reprojects the collapsed view
        // (keeping the current drilled-into set); camera holds.
        if (currentLens === 'overview') { renderOverview(false); return; }
        const label = currentStyle || 'Dau (default)';
        // Immediate feedback: a styled re-render of a whole chain (oval refit +
        // hand-drawn) can take a few seconds, so show progress rather than
        // appearing frozen.
        setStatus('Rendering in ' + label +
          (chainFrames.length ? ' (' + chainFrames.length + ' states)…' : '…'));
        try {
          if (chainFrames.length) {
            const res = await fetch(
              '/organon/uods/' + encodeURIComponent(selectedUodId) + '/chain' + styleQuery()
            );
            const body = await res.json();
            if (body.success && body.data && body.data.has_chain) {
              chainFrames = body.data.frames || [];
              // Style/engine reproject the Drawing; if a structural lens is active
              // it is style-independent, so leave it untouched.
              if (currentLens === 'drawing') {
                showFrame(Math.min(chainIndex, chainFrames.length - 1), false);
              }
            }
          } else {
            const res = await fetch(
              '/organon/uods/' + encodeURIComponent(selectedUodId) + styleQuery()
            );
            const body = await res.json();
            if (body.success) {
              currentDrawingSvg = body.data.svg;
              currentDrawingForms = body.data.linear_forms;
              if (currentLens === 'drawing') renderCanvas(body.data.svg, body.data.linear_forms, false);
            }
          }
          setStatus('Viewing in ' + (currentStyle || 'Dau (default)') + ' style.');
        } catch (e) {
          setStatus('Style render failed: ' + e.message, true);
        }
      }

      // Render a state and frame it via the shared DiagramViewer. The chain
      // player walks states that vary widely in size, so the convention is
      // fit-to-content with an animated camera: each frame is fitted, and when
      // *animateFromPrevious* is set the camera *dollies* from the previous view
      // to the new fit rather than snapping (TRANSFORMATION_WORKFLOW_SPEC §3a) —
      // the same engine the workshop uses with its hold-the-camera convention.
      const diagramView = new DiagramViewer({ minZoom: 0.05 }).attach(canvasEl);
      function renderCanvas(svg, linearForms, animateFromPrevious) {
        svgPanZoomInstance = diagramView.render(svg, {
          camera: 'fit', dolly: !!animateFromPrevious,
        });
        if (window.LinearFormPanel) {
          window.LinearFormPanel.render(canvasEl, linearForms);
        }
        // The context reflex: the ground + (on click) which cuts enclose an
        // element. The panel re-attaches on every render (the host innerHTML is
        // swapped); the click handler re-binds to the fresh SVG.
        if (window.ContextReflex) {
          window.ContextReflex.render(canvasEl, {
            ground: currentContextGround,
            introspection: currentContextIntrospection,
          });
          diagramView.onElementClick(function (id) {
            if (id) window.ContextReflex.select(canvasEl, id);
          });
        }
      }

      // The introspection now travels *with* the rendered state (detail payload
      // and each chain frame carry an `introspection` block from the same egi as
      // the svg, so element ids match the drawing exactly). No separate fetch.

      // ---- Adaptive-scope lenses ----
      // The Lens selector swaps what is mounted in #organon-canvas. "drawing" is
      // the attested SVG (the Drawing lens); the others are read-only structural
      // projections fetched from the (O(n)) /structure and /history-structure
      // endpoints. Switching back to drawing restores the attested render exactly.
      const viewLensSel = document.getElementById('view-lens');

      function destroyActiveLens() {
        if (activeLensHandle) { try { activeLensHandle.destroy(); } catch (_) {} activeLensHandle = null; }
      }

      // Reveal/hide the diachronic lens options (only meaningful for a chained
      // UoD). The DAG lens is offered for any chain; the *linear* lenses
      // (storyboard / time-stack, which read a single line) only when the chain
      // doesn't branch — a branching episode is the DAG lens's job.
      function setDiachronicLensesAvailable(yes, branching) {
        // modal (◇/□) and audit (verdict trajectory) read the chain like the DAG
        // lens — offered for any chain (modal is sharpest on a branching one).
        // The modal lens stays offered even WITHOUT a chain: on a synchronic UoD it
        // teaches the point — a static graph has no branching frame to read ◇/□ off
        // (the de inesse half of docs/GAMMA_DEMONSTRATIONS.md §4 depends on seeing that).
        const avail = { storyboard: yes && !branching, 'time-stack': yes && !branching,
                        'derivation-dag': yes, modal: true, audit: yes };
        Object.keys(avail).forEach(v => {
          const opt = viewLensSel && viewLensSel.querySelector('option[value="' + v + '"]');
          if (opt) { opt.disabled = !avail[v]; opt.hidden = !avail[v]; }
        });
        if (!avail[currentLens] && (currentLens === 'storyboard' ||
            currentLens === 'time-stack' || currentLens === 'derivation-dag' ||
            currentLens === 'modal' || currentLens === 'audit')) {
          selectLens('drawing');
        }
      }

      function selectLens(lens) {
        currentLens = lens;
        if (viewLensSel && viewLensSel.value !== lens) viewLensSel.value = lens;
        renderLens(lens);
      }

      // U8: open a derivation-DAG state in the Drawing lens — find the chain frame
      // for that state id and switch to the drawing (which restores the player,
      // linear form, and context reflex at that frame).
      function jumpToState(stateId) {
        const idx = chainFrames.findIndex(fr => fr.state_id === stateId);
        if (idx < 0) {
          setStatus('That state is not on the linear chain player.', true);
          return;
        }
        chainIndex = idx;
        selectLens('drawing');
      }

      // Show/hide the overview controls (Collapse-all + hint) — overview lens only.
      function setOverviewControls(on) {
        const c = document.getElementById('overview-controls');
        if (c) c.style.display = on ? 'inline-flex' : 'none';
      }

      async function renderLens(lens) {
        currentLens = lens;
        destroyActiveLens();
        setOverviewControls(lens === 'overview');
        if (lens === 'drawing') {
          // The chain player belongs to the Drawing lens; restore it if diachronic.
          if (currentHasChain) {
            if (cp.bar) cp.bar.style.display = 'flex';
            showFrame(chainIndex, false);
          } else {
            renderCanvas(currentDrawingSvg, currentDrawingForms, false);
          }
          return;
        }
        // Non-drawing lenses: the player is hidden (these are alternative views).
        stopPlay();
        if (cp.bar) cp.bar.style.display = 'none';
        if (lens === 'overview') {
          // Adaptive-scope: a fresh entry starts collapsed (auto-policy), fit camera.
          overviewExpanded = new Set();
          await renderOverview(true);
          return;
        }
        canvasEl.innerHTML = '<div id="organon-canvas-placeholder">Rendering lens…</div>';
        try {
          if (!selectedUodId) return;
          if (lens === 'well') {
            if (!currentStructure) currentStructure = await window.LensCommon.fetchStructure(selectedUodId);
            const mod = await import('/js/negation-well-lens.js');
            activeLensHandle = mod.mount(canvasEl, currentStructure);
          } else if (lens === 'storyboard') {
            if (!currentHistory) currentHistory = await window.LensCommon.fetchHistory(selectedUodId);
            activeLensHandle = window.Storyboard.mount(canvasEl, currentHistory);
          } else if (lens === 'time-stack') {
            if (!currentHistory) currentHistory = await window.LensCommon.fetchHistory(selectedUodId);
            const mod = await import('/js/time-stack-lens.js');
            activeLensHandle = mod.mount(canvasEl, currentHistory);
          } else if (lens === 'derivation-dag') {
            if (!currentHistory) currentHistory = await window.LensCommon.fetchHistory(selectedUodId);
            activeLensHandle = window.DerivationDag.mount(canvasEl, currentHistory, jumpToState);
          } else if (lens === 'modal') {
            // ◇/□ off the branching history (modal_query) — the lens owns its
            // fetch + the states/leaves toggle.
            activeLensHandle = window.ModalLens.mount(canvasEl, selectedUodId);
          } else if (lens === 'audit') {
            // The verdict trajectory of a model revised through dialog
            // (model_revision) — the lens owns its fetch + the editable proposal.
            activeLensHandle = window.AuditLens.mount(canvasEl, selectedUodId);
          } else if (lens === 'accessible') {
            // The non-visual, screen-reader-native projection (accessible_projection)
            // — synchronic (any UoD, no chain needed); the lens owns its fetch.
            activeLensHandle = window.AccessibleLens.mount(canvasEl, selectedUodId);
          }
        } catch (e) {
          canvasEl.innerHTML = '<div id="organon-canvas-placeholder" style="color:var(--ctp-maroon);">' +
            'Lens failed: ' + escapeHtml(e.message || String(e)) + '</div>';
        }
      }

      // ---- Overview (adaptive-scope navigation projection) ----
      // The Drawing at a reduced level of detail: deep cuts collapse into
      // content-sized placeholders so a graph ELK can't draw whole stays within
      // budget. Server path = collapse_quotient → generate_layout (?lod=overview);
      // it returns the SVG + a `collapsed` badge map (cut id → form-only counts).
      // Tap a placeholder to expand it (camera holds, detail appears in place).

      function ovUrl() {
        const q = ['lod=overview'];
        if (overviewExpanded.size) {
          q.push('expand=' + encodeURIComponent(Array.from(overviewExpanded).join(',')));
        }
        if (currentStyle) q.push('style=' + encodeURIComponent(currentStyle));
        return '/organon/uods/' + encodeURIComponent(selectedUodId) + '?' + q.join('&');
      }

      async function renderOverview(fitCamera) {
        if (!selectedUodId) return;
        overviewLoading = true;
        if (fitCamera) {
          canvasEl.innerHTML = '<div id="organon-canvas-placeholder">Rendering overview…</div>';
        }
        try {
          const res = await fetch(ovUrl());
          const body = await res.json();
          if (!body.success) {
            canvasEl.innerHTML = '<div id="organon-canvas-placeholder" style="color:var(--ctp-maroon);">' +
              escapeHtml((body.error && body.error.message) || 'Overview failed') + '</div>';
            return;
          }
          const data = body.data;
          const collapsed = data.collapsed || {};
          // Render the overview SVG via the shared viewer. Fit on first entry;
          // hold (keep, re-fit only if it overflows) on an expand so detail
          // appears in place — the map-app feel (docs/ADAPTIVE_SCOPE_VIEWER.md §6).
          svgPanZoomInstance = diagramView.render(data.svg, {
            camera: fitCamera ? 'fit' : 'keep',
          });
          decorateOverview(collapsed);
          const n = Object.keys(collapsed).length;
          const hint = document.getElementById('ov-hint');
          if (hint) {
            hint.textContent = n
              ? n + ' placeholder' + (n === 1 ? '' : 's') + ' — tap to expand'
              : 'fully expanded (nothing collapsed)';
          }
          setStatus(n
            ? 'Overview: ' + n + ' collapsed region(s). Tap a placeholder to drill in. ' +
              'Attested by attest_overview (not full §3.3 — a navigation projection).'
            : 'Overview: this graph fits the budget — drawn in full.');
        } catch (e) {
          setStatus('Overview render failed: ' + e.message, true);
        } finally {
          overviewLoading = false;
        }
      }

      // Draw a badge + clickable hit-area over each collapsed placeholder cut.
      // Coordinates come from each cut <g>'s getBBox() (final SVG user space), so
      // no renderer-offset math is needed; appending into that same <g> inherits
      // its coordinate system and pans/zooms with the diagram.
      function decorateOverview(collapsed) {
        const svg = canvasEl.querySelector('svg');
        if (!svg) return;
        const ns = 'http://www.w3.org/2000/svg';
        Object.keys(collapsed).forEach(function (cutId) {
          const badge = collapsed[cutId];
          let g = null;
          try { g = svg.querySelector('[data-element-type="cut"][data-element-id="' + CSS.escape(cutId) + '"]'); } catch (_) {}
          if (!g) return;
          let bb; try { bb = g.getBBox(); } catch (_) { return; }
          if (!bb || !bb.width) return;
          const cx = bb.x + bb.width / 2, cy = bb.y + bb.height / 2;

          const grp = document.createElementNS(ns, 'g');
          grp.setAttribute('class', 'overview-badge');
          grp.setAttribute('data-overview-cut', cutId);

          const hit = document.createElementNS(ns, 'rect');
          hit.setAttribute('class', 'ov-hit');
          hit.setAttribute('x', bb.x); hit.setAttribute('y', bb.y);
          hit.setAttribute('width', bb.width); hit.setAttribute('height', bb.height);
          grp.appendChild(hit);

          // Compact, form-only label: cuts / relations / lines (+ boundary lines).
          const main = (badge.predicates || 0) + ' rel · ' + (badge.cuts || 0) +
            ' cut' + ((badge.cuts === 1) ? '' : 's') + ' · ' + (badge.vertices || 0) +
            ' line' + ((badge.vertices === 1) ? '' : 's');
          const sub = '＋ expand' + (badge.boundary_degree
            ? '  ·  ⇢ ' + badge.boundary_degree + ' enter' : '');
          const padX = 8, w = Math.max(96, main.length * 6.6 + padX * 2), h = 30;
          const pill = document.createElementNS(ns, 'rect');
          pill.setAttribute('class', 'ov-pill');
          pill.setAttribute('x', cx - w / 2); pill.setAttribute('y', cy - h / 2);
          pill.setAttribute('width', w); pill.setAttribute('height', h);
          pill.setAttribute('rx', 6); pill.setAttribute('ry', 6);
          grp.appendChild(pill);

          const t1 = document.createElementNS(ns, 'text');
          t1.setAttribute('class', 'ov-pill-text');
          t1.setAttribute('x', cx); t1.setAttribute('y', cy - 2);
          t1.setAttribute('text-anchor', 'middle');
          t1.textContent = main;
          grp.appendChild(t1);

          const t2 = document.createElementNS(ns, 'text');
          t2.setAttribute('class', 'ov-sub-text');
          t2.setAttribute('x', cx); t2.setAttribute('y', cy + 11);
          t2.setAttribute('text-anchor', 'middle');
          t2.textContent = sub;
          grp.appendChild(t2);

          // Tap-to-expand, per badge. svg-pan-zoom grabs pointer events on the
          // SVG (and preventDefaults mousedown, which would swallow a bubbled
          // click), so we stop the badge's mousedown from reaching it — the badge
          // is a button, not a pan handle — and expand on click.
          grp.addEventListener('mousedown', function (e) { e.stopPropagation(); });
          grp.addEventListener('click', function (e) {
            e.stopPropagation();
            expandOverviewCut(cutId);
          });

          g.appendChild(grp);
        });
      }

      function expandOverviewCut(cutId) {
        if (!cutId || overviewLoading || currentLens !== 'overview') return;
        overviewExpanded.add(cutId);
        renderOverview(false);  // keep camera — detail appears in place
      }

      const ovReset = document.getElementById('ov-reset');
      if (ovReset) ovReset.addEventListener('click', function () {
        if (currentLens !== 'overview') return;
        overviewExpanded = new Set();
        renderOverview(true);  // back to the top-level overview, re-fit
      });

      // ---- Diachronic chain player ----

      const cp = {
        bar: document.getElementById('chain-player'),
        first: document.getElementById('cp-first'),
        prev: document.getElementById('cp-prev'),
        play: document.getElementById('cp-play'),
        next: document.getElementById('cp-next'),
        last: document.getElementById('cp-last'),
        counter: document.getElementById('cp-counter'),
        annotation: document.getElementById('cp-annotation'),
      };

      function stopPlay() {
        if (chainPlayTimer) { clearInterval(chainPlayTimer); chainPlayTimer = null; }
        if (cp.play) cp.play.textContent = '▶ Play';
      }

      function hidePlayer() {
        stopPlay();
        chainFrames = [];
        chainIndex = 0;
        if (cp.bar) cp.bar.style.display = 'none';
      }

      function showFrame(i, animate) {
        if (!chainFrames.length) return;
        chainIndex = Math.max(0, Math.min(i, chainFrames.length - 1));
        const f = chainFrames[chainIndex];
        const total = chainFrames.length - 1;  // step count (frame 0 is base)
        // Context reflex: this frame's ground position + its own introspection
        // (bundled with the frame, so element ids match this drawing). Set before
        // the render so the panel paints with the right enclosure data.
        if (currentContextGround) {
          currentContextGround.derivation = chainIndex === 0
            ? { label: 'state', text: 'base · 0 of ' + total }
            : { label: 'state', text: chainIndex + ' of ' + total };
        }
        currentContextIntrospection = f.introspection || null;
        if (canvasEl) canvasEl.dataset.cxSel = '';   // selection is per-state
        renderCanvas(f.svg, f.linear_forms, animate);
        if (cp.counter) {
          cp.counter.textContent = chainIndex === 0
            ? 'base state · 0 / ' + total
            : 'state ' + chainIndex + ' / ' + total;
        }
        if (cp.annotation) {
          // U10: name the rule + rationale AND what the step changed (the legible
          // diff: "+2 / −1 …"), so a logician verifies each step added/removed
          // exactly what it should — not just which rule fired.
          const diff = (f.diff && f.diff.summary && f.diff.summary !== 'no net change')
            ? '  ·  this step: ' + f.diff.summary : '';
          cp.annotation.textContent = f.kind === 'base'
            ? 'The blank/asserted starting context.'
            : (f.rule ? f.rule + ' — ' : '') + (f.annotation || '') + diff;
        }
        if (cp.prev) cp.prev.disabled = chainIndex === 0;
        if (cp.first) cp.first.disabled = chainIndex === 0;
        if (cp.next) cp.next.disabled = chainIndex === total;
        if (cp.last) cp.last.disabled = chainIndex === total;
        // Keep the header "shape" counts in step with the frame on screen.
        // The base frame is the blank/asserted starting context (often 0/0/0),
        // so qualify it — otherwise the bare counts read as the theorem's own
        // shape rather than the empty sheet the derivation starts from.
        const shapeEl = document.getElementById('shape-counts');
        if (shapeEl && f.egi_summary) {
          shapeEl.textContent = shapeText(f.egi_summary) +
            (f.kind === 'base' ? ' · starting context' : '');
        }
      }

      function togglePlay() {
        if (chainPlayTimer) { stopPlay(); return; }
        if (!chainFrames.length) return;
        // From the last frame, Play restarts at the base.
        if (chainIndex >= chainFrames.length - 1) showFrame(0, false);
        cp.play.textContent = '⏸ Pause';
        chainPlayTimer = setInterval(function () {
          if (chainIndex >= chainFrames.length - 1) { stopPlay(); return; }
          showFrame(chainIndex + 1, true);
          // Stop as soon as the final frame is shown (don't idle a tick on it).
          if (chainIndex >= chainFrames.length - 1) stopPlay();
        }, 1100);
      }

      async function loadChain(uodId) {
        hidePlayer();
        currentHasChain = false;
        setDiachronicLensesAvailable(false);
        try {
          const res = await fetch('/organon/uods/' + encodeURIComponent(uodId) + '/chain' + styleQuery());
          const body = await res.json();
          if (!body.success || !body.data || !body.data.has_chain) return;
          const frames = body.data.frames || [];
          if (frames.length < 2) return;  // nothing to play through
          chainFrames = frames;
          currentHasChain = true;
          // reveal the diachronic lenses (DAG always; linear ones only if a line)
          setDiachronicLensesAvailable(true, !!body.data.branching);
          // A worked chain exists → offer the whole-chain LaTeX document export.
          const chainBtn = document.getElementById('export-chain-go');
          if (chainBtn) chainBtn.style.display = 'inline-block';
          if (cp.bar) cp.bar.style.display = 'flex';
          // Start at the base state so the episode plays forward.
          showFrame(0, false);
          setStatus('Diachronic chain: ' + (frames.length - 1) +
            ' move(s). Use the player to follow each rule application.');
        } catch (_) { /* leave player hidden on any error */ }
      }

      if (cp.first) cp.first.addEventListener('click', function () { stopPlay(); showFrame(0, true); });
      if (cp.prev)  cp.prev.addEventListener('click', function () { stopPlay(); showFrame(chainIndex - 1, true); });
      if (cp.next)  cp.next.addEventListener('click', function () { stopPlay(); showFrame(chainIndex + 1, true); });
      if (cp.last)  cp.last.addEventListener('click', function () { stopPlay(); showFrame(chainFrames.length - 1, true); });
      if (cp.play)  cp.play.addEventListener('click', togglePlay);

      // ---- Export ----
      function b64ToBlob(b64, mime) {
        const bytes = atob(b64);
        const arr = new Uint8Array(bytes.length);
        for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
        return new Blob([arr], { type: mime });
      }

      async function loadExportFormats() {
        try {
          const body = await fetch('/export/formats').then((r) => r.json());
          if (!body.success) return;
          exportFormats = body.data;
          const sel = document.getElementById('export-format');
          sel.innerHTML = '';
          exportFormats.forEach((f) => {
            const o = document.createElement('option');
            o.value = f.format;
            o.textContent = f.label + (f.available ? '' : ' (unavailable)');
            o.disabled = !f.available;
            sel.appendChild(o);
          });
          // The "cite" affordance is meaningful only for the authentic-Peirce
          // LaTeX export (a scholarly figure caption from the UoD's provenance).
          const toggleCite = () => {
            const wrap = document.getElementById('export-cite-wrap');
            if (wrap) wrap.style.display = (sel.value === 'peirce-tikz') ? 'inline' : 'none';
            refreshCiteGate();  // U18: honesty gate on has_source
          };
          sel.addEventListener('change', toggleCite);
          toggleCite();
        } catch (_) {}
      }

      async function doExport() {
        if (!exportUodId) return;
        const fmt = document.getElementById('export-format').value;
        // "Export what you see": use the current view projection (style + layout
        // engine from the toolbar), not a separate, easily-desynced dropdown.
        const style = currentStyle;
        const exStatus = document.getElementById('export-status');
        const label = (currentStyle || 'Dau (default)') +
          (currentEngine && currentEngine !== 'elk' ? ' / ' + currentEngine : '');
        exStatus.textContent = 'Exporting ' + fmt + ' in ' + label + '…';
        try {
          const body = await fetch('/export', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              uod_id: exportUodId, format: fmt,
              style_name: style || null, engine: currentEngine || 'elk',
              // Scholarly citation caption — authentic-Peirce only (its provenance).
              cite: fmt === 'peirce-tikz' && document.getElementById('export-cite').checked,
            }),
          }).then((r) => r.json());
          if (!body.success) { exStatus.textContent = 'Failed: ' + (body.error && body.error.message); return; }
          const a = body.data;
          showArtifact(a, fmt);
          exStatus.textContent = 'Exported ' + a.filename + '.';
        } catch (e) { exStatus.textContent = 'Network error: ' + e.message; }
      }

      // Render an export artifact (text or binary) into the output block — shared
      // by the single-graph export and the worked-chain document export.
      function showArtifact(a, fmt) {
        const dl = document.getElementById('export-download');
        const out = document.getElementById('export-output');
        const txt = document.getElementById('export-text');
        if (a.is_binary) {
          const blob = b64ToBlob(a.content_base64, a.media_type);
          dl.href = URL.createObjectURL(blob);
          dl.download = a.filename;
          dl.textContent = '⤓ download ' + a.filename;
          out.style.display = 'block';
          txt.style.display = 'none';
          document.getElementById('export-copy').style.display = 'none';
        } else {
          txt.style.display = 'block';
          txt.value = a.content;
          document.getElementById('export-copy').style.display = 'inline-block';
          const blob = new Blob([a.content], { type: a.media_type });
          dl.href = URL.createObjectURL(blob);
          dl.download = a.filename;
          dl.textContent = '⤓ download ' + a.filename;
          out.style.display = 'block';
          // SVG: also refresh the canvas preview in the chosen style.
          if (fmt === 'svg') {
            canvasEl.innerHTML = a.content;
            const svgEl = canvasEl.querySelector('svg');
            if (svgEl && window.svgPanZoom) {
              svgEl.setAttribute('width', '100%'); svgEl.setAttribute('height', '100%');
              window.svgPanZoom(svgEl, { zoomEnabled: true, controlIconsEnabled: false, fit: true, center: true, minZoom: 0.1, maxZoom: 20 });
            }
          }
        }
      }

      // U5: export the whole worked derivation as one authentic-Peirce LaTeX
      // document — one captioned figure per proof step (POST /export/chain).
      async function doExportChain() {
        if (!exportUodId) return;
        const exStatus = document.getElementById('export-status');
        exStatus.textContent = 'Exporting worked chain (LaTeX)…';
        try {
          const body = await fetch('/export/chain', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              uod_id: exportUodId,
              style_name: currentStyle || null, engine: currentEngine || 'elk',
            }),
          }).then((r) => r.json());
          if (!body.success) {
            exStatus.textContent = 'Failed: ' + (body.error && body.error.message); return;
          }
          showArtifact(body.data, 'tex');
          exStatus.textContent = 'Exported ' + body.data.filename + '.';
        } catch (e) { exStatus.textContent = 'Network error: ' + e.message; }
      }

      // U6/U18: the UoD's scholarly citation (author-date line + BibTeX) from its
      // provenance. Fabricates nothing — a sourceless graph reports has_source:false,
      // which also gates the "cite" caption checkbox (no fake caption on a synthetic).
      async function loadCitation(uodId) {
        currentCitation = null;
        const block = document.getElementById('export-cite-block');
        if (block) block.style.display = 'none';
        try {
          const body = await fetch('/export/citation?uod_id=' + encodeURIComponent(uodId))
            .then((r) => r.json());
          if (!body.success || !body.data) { refreshCiteGate(); return; }
          currentCitation = body.data;
          const line = document.getElementById('cite-line');
          const bib = document.getElementById('cite-bibtex');
          const note = document.getElementById('cite-source-note');
          if (line) line.textContent = currentCitation.citation || '';
          if (bib) bib.value = currentCitation.bibtex || '';
          if (note) {
            note.textContent = currentCitation.has_source ? '(from provenance)'
              : '(no recorded source — reproduced with Arisbe)';
            note.style.color = 'var(--ctp-overlay0)';
          }
          if (block) block.style.display = 'block';
        } catch (_) { /* leave citation hidden on any error */ }
        refreshCiteGate();
      }

      // U18: the cite caption is honest only when there is a source to cite —
      // disable the checkbox (and say why) for a sourceless graph.
      function refreshCiteGate() {
        const cb = document.getElementById('export-cite');
        const wrap = document.getElementById('export-cite-wrap');
        if (!cb || !wrap) return;
        const sourceless = currentCitation && currentCitation.has_source === false;
        cb.disabled = !!sourceless;
        if (sourceless) { cb.checked = false; }
        wrap.title = sourceless
          ? 'This graph has no recorded source — no citation caption to emit.'
          : "Emit this graph's scholarly citation (from its provenance) as a caption under the figure.";
        wrap.style.opacity = sourceless ? '0.5' : '1';
      }

      // ---- Unified action toolbar: transfer (Import/Export) + cross-mode ----
      // Item actions enable when a UoD is open; the global Import is always live.
      // Organon is the reference shelf; these verbs hand a corpus graph to the
      // other modes (it is *consumed*, never written back here — the mode
      // contract: a graph reaches the corpus only via Agon or Import).
