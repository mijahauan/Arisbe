      const ITEM_ACTION_IDS = ['act-ergasterion', 'act-agon', 'act-agon-model', 'act-copy', 'act-export'];
      function setItemActionsEnabled(on) {
        ITEM_ACTION_IDS.forEach(function (id) {
          const b = document.getElementById(id);
          if (b) b.disabled = !on;
        });
      }
      document.getElementById('btn-import').addEventListener('click', function () {
        window.location.href = '/import';
      });
      // ④ The form's ground travels with it: pass the source UoD's name + mode so the
      // destination's context reflex can say "carried from: <name> (Organon)".
      function originSuffix() {
        const nm = (currentContextGround && currentContextGround.universe) || selectedUodId || '';
        return nm ? ('&from=' + encodeURIComponent(nm) + '&fromMode=organon') : '';
      }
      document.getElementById('act-ergasterion').addEventListener('click', function () {
        if (!selectedUodId) return;
        // The workshop opens a regime-1 *copy* as its base — a draft to transform.
        window.location.href = '/ergasterion?open=' + encodeURIComponent('uod:' + selectedUodId) + originSuffix();
      });
      document.getElementById('act-agon').addEventListener('click', function () {
        if (!currentEgif) { setStatus('No linear form available to carry into Agon.', true); return; }
        // The corpus is a source of *proposals*, not only of models: carry the graph
        // in as the proposal G — the claim to be tested. (A learner's G originates
        // here in Organon or is composed in Ergasterion, then travels to the arena.)
        window.location.href = '/agon?proposal_egif=' + encodeURIComponent(currentEgif) + originSuffix();
      });
      document.getElementById('act-agon-model').addEventListener('click', function () {
        if (!currentEgif) { setStatus('No linear form available to carry into Agon.', true); return; }
        // Or use the graph as the reference model M — the world a proposal is tested against.
        window.location.href = '/agon?model_egif=' + encodeURIComponent(currentEgif) + originSuffix();
      });
      document.getElementById('act-copy').addEventListener('click', function () {
        if (!currentEgif) return;
        if (navigator.clipboard) navigator.clipboard.writeText(currentEgif);
        setStatus('Copied EGIF to clipboard.');
      });
      document.getElementById('act-export').addEventListener('click', function () {
        const panel = document.getElementById('organon-export');
        if (!panel) return;
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        if (panel.style.display === 'block') panel.scrollIntoView({ block: 'nearest' });
      });

      document.getElementById('export-go').addEventListener('click', doExport);
      document.getElementById('export-chain-go').addEventListener('click', doExportChain);
      document.getElementById('cite-copy').addEventListener('click', function () {
        const bib = document.getElementById('cite-bibtex');
        if (bib && navigator.clipboard) navigator.clipboard.writeText(bib.value);
      });
      document.getElementById('export-copy').addEventListener('click', function () {
        const txt = document.getElementById('export-text');
        if (navigator.clipboard) navigator.clipboard.writeText(txt.value);
      });

      filterEl.addEventListener('input', applyFilter);
      const sortSel = document.getElementById('organon-sort');
      if (sortSel) {
        sortSel.addEventListener('change', function () {
          sortMode = sortSel.value;
          applyFilter();
        });
      }
      // Reveal the "style-only reprojection" note whenever a non-default style or
      // layout is active — making legible that the restyle redraws the same
      // proposition and inherits its standing (correspondence, not truth).
      function updateReprojectionNote() {
        const note = document.getElementById('reprojection-note');
        if (!note) return;
        const reprojected = (currentStyle && currentStyle !== '') ||
          (currentEngine && currentEngine !== 'elk');
        note.style.display = reprojected ? 'inline-flex' : 'none';
      }
      const viewStyleSel = document.getElementById('view-style');
      if (viewStyleSel) {
        viewStyleSel.addEventListener('change', function () {
          currentStyle = viewStyleSel.value;
          updateReprojectionNote();
          applyViewStyle();
        });
      }
      const viewEngineSel = document.getElementById('view-engine');
      if (viewEngineSel) {
        viewEngineSel.addEventListener('change', function () {
          currentEngine = viewEngineSel.value;
          updateReprojectionNote();
          applyViewStyle();  // re-fetch + re-render in the chosen layout engine
        });
      }
      if (viewLensSel) {
        viewLensSel.addEventListener('change', function () {
          renderLens(viewLensSel.value);  // swap the projection mounted in the canvas
        });
      }
      loadExportFormats();
      loadCorpus();
    })();
  </script>
</body>
</html>
