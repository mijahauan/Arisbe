[project]
name = "arisbe"
version = "2.0.0b1"
description = "Mathematically rigorous implementation of Existential Graphs based on Frithjof Dau's formalism"
readme = "docs/README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Arisbe Project" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "PyYAML>=6.0",
    "frozendict>=2.3.0",
    "PySide6>=6.5.0",
    "Pillow>=10.0.0",
    "graphviz>=0.20.0",
    "shapely>=2.0.0",
    "pyvisgraph>=0.2.1",
    "rectpack>=0.2.2",
    "numpy<2.0.0",
    "rtree>=1.0.0",
    "pdfminer.six>=20231228",
    "networkx>=3.0",
    "pathfinding>=1.0.0",
    "jsonschema>=4.20.0",
    "psutil>=5.9.0",
    "rdflib>=7.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.100",
    # Headless-browser E2E for the Ergasterion freeform canvas
    # (tests/test_ergasterion_freeform_e2e.py). The browser binary is installed
    # separately: `uv run playwright install chromium`. The test skips cleanly
    # if Playwright/Chromium is absent.
    "pytest-playwright>=0.5.0",
    # FastAPI's TestClient (route tests) requires httpx; starlette leaves it optional.
    "httpx>=0.27",
    # SMT backend for z3_semantic_validator — the authoritative FOL-entailment oracle
    # for the FOLIO evaluation. Optional at runtime (guarded by Z3_AVAILABLE); needed
    # for the reasoning/benchmark tests.
    "z3-solver>=4.12",
]
web = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.30.0",
]
# Natural-language front-end for the NL->logic arc (src/nl_to_logic.py): the LLM
# proposes a candidate FOL form, Arisbe parses + tests it. Optional at runtime
# (guarded by ANTHROPIC_AVAILABLE); the deterministic --no-llm path and every
# non-LLM test run with the SDK absent.
nl = [
    "anthropic>=0.40",
]
# The MCP verifier service (src/mcp_server.py): exposes the mechanical referee
# (src/mcp_verifier.py — parse/validate, peel, apply/validate a Dau rule, §3.3
# attest) as Model Context Protocol stdio tools so any MCP-speaking agent
# framework can call the calculus core. Optional at runtime (guarded by
# MCP_AVAILABLE); the pure verifier functions and every non-server test run with
# the SDK absent. Serve with `uv run --extra mcp python -m mcp_server`.
mcp = [
    "mcp>=1.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
# Never auto-collect from these directories. The "*" / "." / "_*" / "build"
# patterns reproduce pytest's defaults (which `norecursedirs` *replaces*
# rather than extends); the project-specific entries are: archive/ holds
# stale Qt-era scripts whose imports no longer resolve; graphify-out/ and
# node_modules/ are tool output; .venv/ is the virtualenv.
norecursedirs = [
    "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}",
    "archive", "graphify-out", ".venv",
]
