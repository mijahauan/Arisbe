[project]
name = "arisbe"
version = "1.0.0"
description = "Mathematically rigorous implementation of Existential Graphs based on Frithjof Dau's formalism"
readme = "docs/README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Arisbe Project" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "PyYAML>=6.0",
    "frozendict>=2.3.0",
    "PySide6>=6.5.0",
    "Pillow>=10.0.0",
    "graphviz>=0.20.0",
    "shapely>=2.0.0",
    "pyvisgraph>=0.2.1",
    "rectpack>=0.2.2",
    "numpy<2.0.0",
    "rtree>=1.0.0",
    "pdfminer.six>=20231228",
    "networkx>=3.0",
    "pathfinding>=1.0.0",
    "jsonschema>=4.20.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.100",
    # Headless-browser E2E for the Ergasterion freeform canvas
    # (tests/test_ergasterion_freeform_e2e.py). The browser binary is installed
    # separately: `uv run playwright install chromium`. The test skips cleanly
    # if Playwright/Chromium is absent.
    "pytest-playwright>=0.5.0",
]
web = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
# Never auto-collect from these directories. The "*" / "." / "_*" / "build"
# patterns reproduce pytest's defaults (which `norecursedirs` *replaces*
# rather than extends); the project-specific entries are: archive/ holds
# stale Qt-era scripts whose imports no longer resolve; graphify-out/ and
# node_modules/ are tool output; .venv/ is the virtualenv.
norecursedirs = [
    "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}",
    "archive", "graphify-out", ".venv",
]
