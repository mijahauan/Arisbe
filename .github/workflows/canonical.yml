name: Canonical Pipeline CI

on:
  push:
    branches: [ main, master, "release/**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  canonical:
    # Pinned, not ubuntu-latest: that label moved to 26.04, on which the locked
    # Playwright (1.60.0) refuses to install chromium ("does not support chromium
    # on ubuntu26.04-x64"), so the job died before a single test ran. Move the
    # pin when the locked Playwright supports the newer image.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python deps
        run: uv sync --extra dev --extra web

      - name: Install Node.js (for ELK layout worker)
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Node deps (elkjs)
        run: npm install

      - name: Install Playwright Chromium (for the e2e suites)
        run: uv run playwright install --with-deps chromium

      - name: Run full test suite
        run: uv run pytest tests/ -q
